<!--
THESIS: задачи — те же документы в той же бумаге. Трекер без канбана и карточек со статус-бейджами: приоритет — рубрика, статус — чекбокс, фильтр — чип, правка — коммит.
OWN-WORLD: мир v1 «Документ» без изменений — холодная бумага #FBFBF9, чернильный найви #1F2A44, синий #3A6FB8 (вкладки, ссылки, активные чипы), коралл #E8553F только REC, янтарь — внимание/просрочка, зелёный — доставлено; + #B3261E только на деструктивной кнопке (нативная афорданс Android). Roboto + Roboto Mono (цифры).
STORY: Никита переключает вкладку «Задачи», чипами сужает до проекта, щёлкает чекбоксы; правка полей и удаление уходят коммитами в тот же репо.
FIRST VIEWPORT: вкладки Заметки|Задачи в шапке, строка чипов-фильтров, рубрики P1/P2/P3, внизу «Новая задача».
FORM: расширение утверждённого скелета А «Документ» (пин владельца, тикет nikitatrubaev-pdj.4); лотерея снята пином — extension без seed.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md — для компа: вердикт impeccable-finish-reviewer + утверждение в тикете nikitatrubaev-5dd.3.
-->

<style>

  *{box-sizing:border-box;margin:0}

  .wrap{max-width:3400px; margin:0 auto; padding:44px 30px 90px}
  .gal h1{font-family:"Roboto",sans-serif; font-weight:700; font-size:clamp(1.6rem,3vw,2.2rem); letter-spacing:-0.02em}
  .gal p{color:var(--g-mut); max-width:64ch; margin-top:8px}
  .row{display:flex; gap:26px; overflow-x:auto; padding:26px 2px 20px; align-items:flex-start}
  .board{flex:0 0 auto}
  .board figcaption{margin-top:10px; font-size:.85rem; color:var(--g-mut); text-align:center}

  /* ===== мир «Документ» — фиксированные цвета (v1) ===== */
  .doc{--paper:#FBFBF9; --paper2:#F3F3EE; --ink:#1F2A44; --mut:#6A7386; --line:#E3E3DC; --blue:#3A6FB8; --blue-soft:#3A6FB81A;
       --rec:#E8553F; --amber:#8A5A0F; --green:#2E7D53; --nav:#243B63; --err:#B3261E;}
  .phone{width:393px; height:852px; border-radius:28px; overflow:hidden; position:relative; box-shadow:0 12px 32px -12px #0006;
         display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-family:"Roboto",sans-serif}
  .sb{display:flex; justify-content:space-between; align-items:center; font-size:.78rem; padding:12px 22px 4px; font-family:"Roboto Mono",monospace; color:var(--mut)}
  .ic{width:22px;height:22px;flex:0 0 auto}
  .ic-s{width:16px;height:16px;flex:0 0 auto}

  .appbar{display:flex; align-items:center; justify-content:space-between; padding:16px 22px 6px}
  .appbar .icons{display:flex; gap:16px; color:var(--mut)}
  .appbar .ic{color:var(--mut)}
  /* v2: вкладки-переключатель в шапке */
  .switch{display:flex; gap:18px; align-items:baseline}
  .switch b{font-family:"Roboto",sans-serif; font-size:1.45rem; font-weight:800; letter-spacing:-0.02em; color:var(--ink)}
  .switch span{font-family:"Roboto",sans-serif; font-size:1.45rem; font-weight:800; letter-spacing:-0.02em; color:var(--mut)}
  .switch .cnt{font-family:"Roboto Mono",monospace; font-size:.78rem; font-weight:400; color:var(--mut); margin-left:2px}

  /* v2: чипы-фильтры */
  .chips{display:flex; gap:8px; padding:10px 22px 12px; overflow:hidden}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:9px; border:1px solid var(--line);
        font-size:.82rem; color:var(--mut); white-space:nowrap; background:none; font-family:inherit}
  .chip svg{width:12px;height:12px}
  .chip.on{background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600}

  .day{font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); padding:18px 22px 4px}
  .doc-item{padding:14px 22px 16px}
  .doc-item + .doc-item{border-top:1px solid var(--line)}
  .doc-item h4{font-family:"Roboto",sans-serif; font-weight:700; font-size:1.02rem; letter-spacing:-0.01em; line-height:1.3}
  .doc-item .prev{color:var(--mut); font-size:.88rem; line-height:1.45; margin-top:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .doc-item .meta{display:flex; gap:8px; align-items:center; margin-top:7px; font-size:.78rem; color:var(--mut)}
  .doc-item .meta .tm{font-family:"Roboto Mono",monospace}
  .doc-item .meta .sep{opacity:.5}
  .doc-item .meta .ok{color:var(--green); display:inline-flex; align-items:center; gap:4px}
  .recbar{margin-top:auto; padding:14px 22px 28px; background:linear-gradient(#FBFBF900,var(--paper) 45%)}
  .recbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px; border-radius:14px; background:var(--nav); color:#F4F7FB; font-weight:600; font-size:1rem; border:none; font-family:inherit}
  .hint{text-align:center; color:var(--mut); font-size:.8rem; margin-top:10px}

  /* v2: строка задачи */
  .trow{display:flex; gap:12px; align-items:flex-start; padding:13px 22px}
  .trow + .trow{border-top:1px solid var(--line)}
  .trow .cb{width:19px; height:19px; border:1.5px solid var(--mut); border-radius:6px; flex:0 0 auto; margin-top:2px}
  .trow.done .cb{background:var(--nav); border-color:var(--nav); display:flex; align-items:center; justify-content:center; color:#F4F7FB}
  .trow h4{font-family:"Roboto",sans-serif; font-weight:700; font-size:.98rem; letter-spacing:-0.01em; line-height:1.35}
  .trow.done h4{color:var(--mut); font-weight:400; text-decoration:line-through; text-decoration-color:#6A738680}
  .trow .meta{display:flex; gap:8px; align-items:center; margin-top:5px; font-size:.78rem; color:var(--mut); flex-wrap:wrap}
  .trow .meta .tm{font-family:"Roboto Mono",monospace}
  .trow .meta .sep{opacity:.5}
  .trow .meta .late{color:var(--amber); font-weight:600; display:inline-flex; gap:4px; align-items:center}
  .trow .meta .sub{display:inline-flex; gap:4px; align-items:center}
  .trow .meta .prog{font-family:"Roboto Mono",monospace}
  .prio{font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); padding:16px 22px 4px; display:flex; gap:8px; align-items:baseline}
  .prio b{font-family:"Roboto Mono",monospace; font-weight:500; color:var(--ink)}
  .fold{display:flex; gap:8px; align-items:center; padding:14px 22px; color:var(--mut); font-size:.85rem; border-top:1px solid var(--line)}
  .fold svg{width:14px;height:14px}

  /* шторки */
  .under{position:absolute; inset:0; display:flex; flex-direction:column; pointer-events:none}
  .under::after{content:""; position:absolute; inset:0; background:#1F2A4459}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:var(--paper); border-radius:24px 24px 0 0; box-shadow:0 -10px 30px -10px #1F2A4466; padding:10px 26px 28px; display:flex; flex-direction:column}
  .handle{width:36px; height:4px; border-radius:2px; background:#C9CEC2; margin:2px auto 14px}
  .sheet h5{font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); font-weight:600; margin-bottom:6px}
  .sheet .title{font-family:"Roboto",sans-serif; font-size:1.15rem; font-weight:800; letter-spacing:-0.015em; margin-bottom:8px}

  /* строки выбора в шторках */
  .opt{display:flex; gap:12px; align-items:center; padding:13px 0; border-top:1px solid var(--line); font-size:.94rem}

  .opt .rad{width:19px;height:19px;border:1.5px solid var(--mut);border-radius:50%;flex:0 0 auto}

  .opt small{display:block; color:var(--mut); font-size:.78rem; margin-top:1px}

  .opt.on .pen{margin-left:12px}
  .search{display:flex; gap:10px; align-items:center; padding:11px 14px; border:1px solid var(--line); border-radius:12px; color:var(--mut); font-size:.9rem; margin:4px 0 6px}

  /* деталка задачи */
  .dt-head{padding:8px 22px 0}

  .seg{display:flex; margin:16px 22px 0; border:1px solid var(--line); border-radius:12px; overflow:hidden}

  .task{display:flex; gap:10px; align-items:flex-start; font-size:.93rem; padding:8px 0}
  .task i{width:17px; height:17px; border:1.5px solid var(--mut); border-radius:5px; display:block; flex:0 0 auto; margin-top:2px}

  .dt-act{display:flex; gap:10px; padding:14px 22px 26px}
  .dt-act button{flex:1; padding:13px; border-radius:12px; border:1px solid var(--line); background:none; color:var(--ink); font-family:inherit; font-size:.87rem; display:flex; align-items:center; justify-content:center; gap:8px}

  .tabs{display:flex; gap:2px; margin:14px 22px 0; border-bottom:1.5px solid var(--line)}

  .tabs button.on{color:var(--blue); border-bottom-color:var(--blue); font-weight:600}
  .body-doc{padding:18px 22px 8px; overflow:hidden; flex:1}
  .body-doc h5{font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); font-weight:600; margin:18px 0 8px; display:flex; align-items:center}
  .body-doc h5:first-child{margin-top:0}
  .body-doc h5 .edit{margin-left:auto; color:var(--blue); display:inline-flex; gap:5px; align-items:center; font-weight:400; letter-spacing:0; text-transform:none; font-size:.8rem}

  .tlink .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

  /* диалог удаления */
  .dlg-wrap{position:absolute; inset:0; background:#1F2A4466; display:flex; align-items:center; justify-content:center; padding:26px}
  .dlg{background:var(--paper); border-radius:24px; padding:24px 24px 14px; width:100%; box-shadow:0 18px 44px -14px #1F2A4488}
  .dlg h4{font-family:"Roboto",sans-serif; font-size:1.2rem; font-weight:800; letter-spacing:-0.015em}
  .dlg .sub{color:var(--mut); font-size:.88rem; margin-top:6px; line-height:1.45}
  .dlg .opt small{font-size:.76rem}
  .dlg .note{font-size:.78rem; color:var(--mut); margin-top:10px}
  .dlg-act{display:flex; justify-content:flex-end; gap:8px; margin-top:14px}
  .dlg-act button{padding:11px 14px; border:none; background:none; font-family:inherit; font-size:.9rem; font-weight:600; border-radius:10px}
  .dlg-act .cancel{color:var(--blue)}
  .dlg-act .del{color:var(--err)}

  .input{padding:13px 14px; border:1.5px solid var(--blue); border-radius:12px; font-size:1rem; margin:2px 0 12px; color:var(--ink)}

  .input .ph{color:#A6ACB9}
  .cta{margin-top:16px; padding:15px; border-radius:14px; border:none; background:var(--nav); color:#F4F7FB; font-weight:700; font-size:.98rem; font-family:inherit; width:100%}
