# Эталон workflow для РЕПО ЗАМЕТОК (не этого репо!) — копия рабочего
# Roflochinsky/voice-notes/.github/workflows/process-notes.yml.
# Контракт формата и промпта — docs/specs/2026-08-24-note-format.md и
# docs/adr/2026-08-26-tasks-as-files.md (схема файла задачи живёт ТОЛЬКО там).
# ADR-гейт: менять промпт только вместе со спекой; триггер-релей — ADR
# docs/adr/2026-08-25-action-trigger-relay.md.
name: Обработка заметок

on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: process-notes
  cancel-in-progress: false

jobs:
  # claude-code-action не поддерживает событие push (src/github/context.ts —
  # только dispatch/schedule/workflow_run и issues/PR), поэтому push лишь
  # перезапускает этот же workflow как workflow_dispatch. Рекурсии нет:
  # workflow_dispatch — документированное исключение из защиты GITHUB_TOKEN.
  relay:
    # ponytail: guard по имени claude[bot] — чтобы пуш самого Action (перенос из
    # inbox/) не запускал холостой Claude-прогон; сломается, только если сменится
    # app-имя у claude-code-action.
    if: github.event_name == 'push' && github.triggering_actor != 'claude[bot]'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run process-notes.yml --repo "$GITHUB_REPOSITORY" --ref main

  process:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Релей диспатчит через GITHUB_TOKEN → актор запуска github-actions (бот);
          # без allowed_bots action отклоняет небот-человеческие запуски.
          allowed_bots: "github-actions"
          claude_args: "--allowedTools Bash,Read,Write,Edit,Glob,Grep --max-turns 60"
          prompt: |
            Ты обрабатываешь новые голосовые заметки в этом репозитории. Контракт формата —
            репо Roflochinsky/noteapp, docs/specs/2026-08-24-note-format.md и
            docs/adr/2026-08-26-tasks-as-files.md; всё нужное повторено здесь.

            Реестры в корне репо — `people.md` (каноничные имена людей) и `projects.md`
            (слаги проектов). Прочитай их перед работой. Они только для чтения: НИКОГДА не
            добавляй туда записи и не правь их — реестры пополняет владелец сам.

            Для КАЖДОГО файла в inbox/ со `status: raw` в frontmatter:
            1. Прочитай транскрипт (и секцию «## Моменты», если есть — это тайм-коды важных
               мест, учитывай их в саммари).
            2. Определи:
               - `type` — ровно один из: встреча, идея, задача, личное, другое;
               - `participants` — имена, реально упомянутые в разговоре (пустой список [],
                 если имён нет). Каждое имя сверь с `people.md`: узнал человека — ставь
                 каноничное написание из реестра; не узнал — оставь имя как услышано в тексте
                 и в реестр его НЕ добавляй;
               - `project` — слаг из `projects.md`, если разговор явно про этот проект; если
                 подходящего слага в реестре нет — поле опусти (в реестр ничего не добавляй);
               - `tags` — свободные слова (0–3), реестра у них нет; если нечего — поле опусти;
               - короткий `title` по-русски;
               - слаг для имени файла: латиница, kebab-case, из темы.
            3. Добавь СВЕРХУ тела (после frontmatter) секцию «## Саммари». Блоки разделены
               пустой строкой, иначе GitHub слепляет их в один абзац:

               ## Саммари
               **Суть.** 1–3 предложения.

               **Ключевое.**
               - пункты (если есть что выделить)
            4. Обнови frontmatter: добавь type, participants, title и — если определились —
               project, tags; смени status на done.
               Поле recorded, duration, device не трогай. Транскрипт не переписывай.
               Порядок ключей ровно такой: recorded, duration, device, type, participants,
               project, tags, title, status.
            5. Перемести файл в папку типа во множественном числе (встреча→встречи,
               идея→идеи, задача→задачи, личное→личное, другое→другое) с именем
               `<та же дата-время>-<слаг>.md` (пример: встречи/2026-08-24-1807-reliz-tgsum.md).
            6. ТОЛЬКО ПОСЛЕ переноса (шаг 5) вытащи из разговора задачи — так `source:` в
               задаче укажет на конечный путь заметки, а не на inbox/. Задача — то, что
               прозвучало как «надо сделать». Задач в разговоре нет — сразу к следующему
               файлу, шаг 7 пропусти: заметка без задач должна выглядеть ровно как раньше.
               Для каждой задачи создай НОВЫЙ файл `tasks/ГГГГ-ММ-ДД-слаг.md`, где дата —
               сегодняшняя (`date +%F`), слаг — латиница kebab-case из сути задачи:

               ---
               title: <заголовок задачи по-русски>
               project: <слаг из projects.md>
               priority: P2
               status: open
               source: <путь заметки после шага 5>
               created: <сегодняшняя дата>
               due: <ГГГГ-ММ-ДД>
               tags: [<тег>]
               ---

               <абзац-пояснение, если в разговоре были детали — не обязателен>

               ## Подзадачи
               - [ ] <шаг>

               Правила файла задачи:
               - обязательны только title, priority, status, created; необязательное поле
                 (project, source, due, tags) именно ОПУСКАЕТСЯ целиком — пустых значений и
                 прочерков быть не должно; секцию «## Подзадачи» опусти, если шагов нет;
               - в схеме есть ещё поле `done` (дата закрытия) — его ставит приложение при
                 переходе задачи в `status: done`. Ты создаёшь задачи только со `status: open`,
                 поэтому `done` не пишешь; но если встретишь его в чужом файле — это законное
                 поле формата, не мусор, не трогай его;
               - priority: P1 — срочно/важно, P2 — обычная (по умолчанию), P3 — потом;
               - подзадачи — плоские чекбоксы одного уровня, вложенности нет;
               - имя файла уникально: посмотри `ls tasks/` и, если `ГГГГ-ММ-ДД-слаг.md` уже
                 занято, добавь суффикс `-2`, потом `-3`. Существующие файлы в `tasks/` не
                 перезаписывай и не изменяй НИКОГДА — только создавай новые;
               - имена людей внутри задачи — по тем же правилам, что `participants` в шаге 2.
            7. Впиши созданные задачи в саммари заметки ссылками — блоком через пустую строку
               после «Ключевое»:

               **Задачи.**
               - [<заголовок задачи>](../tasks/<имя созданного файла>.md)

               Заметка лежит в папке типа, вложенных папок в репо нет — поэтому путь всегда
               `../tasks/…`. Чекбоксов `- [ ]` в заметке не оставляй: статус задачи живёт
               только в её файле.
            8. Если inbox/ пуст или raw-файлов нет — ничего не делай и заверши работу.

            Перед коммитом проверь себя:
            - ни в одном созданном файле `tasks/` поле `source:` не начинается с `inbox/`
              (начинается — значит, задачи вытащены до переноса заметки: перепиши поле на
              конечный путь);
            - в секции «Задачи» обработанных заметок нет чекбоксов `- [ ]`, только ссылки;
            - ни один файл в `tasks/`, существовавший до твоей работы, не изменён:
              `git status --porcelain tasks/` показывает только строки `??`/`A`.

            Когда все файлы обработаны:
            git config user.name "github-actions[bot]" &&
            git config user.email "github-actions[bot]@users.noreply.github.com",
            закоммить все изменения — заметки и новые файлы задач — одним коммитом с русским
            сообщением (например: «Обработаны заметки: <имена>»).
            `git push` НЕ делай: пушит следующий шаг workflow.

      # Приложение пишет в этот же репо под PAT, поэтому ветка могла уехать за время
      # прогона и push с устаревшего checkout отвалится — отсюда ребейз и повтор.
      # set-url обязателен: claude-code-action на своём шаге сносит заголовок авторизации
      # от checkout, подставляет в origin свой app-токен и в конце шага его отзывает
      # (в логе: «Removing existing git authentication headers» → «Updated remote URL with
      # authentication token» → «Revoke app token»), так что к этому моменту в origin лежит
      # мёртвый токен. Пушим своим GITHUB_TOKEN; такой пуш ещё и не порождает нового
      # запуска workflow — защита GitHub от самозапуска.
      - name: Пуш заметок с ребейзом
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for _ in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
