android.useAndroidX=true

# Скорость сборки. Заведено 2026-08-29 после замера: полный гейт шёл 5 минут, а
# gradle.properties состоял из одной строки — ни кэша, ни параллели.
#
# caching — главное для нашей работы: агенты сидят в разных git-worktree, у каждого свой
# build/, и без общего кэша каждый компилирует одно и то же заново. Кэш лежит в ~/.gradle
# и общий на все деревья.
org.gradle.caching=true
org.gradle.parallel=true
# Демоны: машина 16 ядер / 10 ГБ. Два агента разом — это два Gradle-демона плюс два
# Kotlin-демона, и памяти впритык (прецедент 2026-08-29: «Failed to run Gradle Worker
# Daemon» у второго агента). Потолки заданы явно, чтобы не уходить в своп.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.incremental=true
