# Поверх дефолтного конфига (buildUponDefaultConfig=true). Compose-специфика: композаблы
# декларативно длинные, палитра — именованные константы-свойства.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
  ReturnCount:
    excludeGuardClauses: true
