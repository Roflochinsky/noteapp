# Поверх дефолтного конфига (buildUponDefaultConfig=true). Compose-специфика: композаблы
# декларативно длинные, палитра — именованные константы-свойства.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
complexity:
  # Файлы разметки экранов выведены из-под правила поимённо (решение владельца 2026-08-29,
  # фактура — журнал docs/plans/2026-08-26-tasks-v2.md): композабл-файл длинный по природе,
  # это разметка, а не поверхность класса. Общего послабления нет: `ignoreAnnotated` здесь
  # ключ-пустышка (правило вешает находку на файл или класс, а они не аннотированы), а
  # `ignorePrivate` глушил ровно те классы, где ревью нашло блокеры.
  TooManyFunctions:
    excludes:
      - '**/ui/TaskSheets.kt'
      - '**/ui/TaskDetailScreen.kt'
      - '**/ui/TasksScreen.kt'
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
  ReturnCount:
    excludeGuardClauses: true
