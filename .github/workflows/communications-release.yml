name: Communications preview release
on:
  push:
    branches: [feat/communications-release-2026-10-08]
    paths: [.release/communications-2026-10-08]
permissions:
  contents: read
concurrency:
  group: communications-preview-2026-10-08
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Roflochinsky/noteapp'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify one-release marker
        run: test "$(cat .release/communications-2026-10-08)" = 'reviewed-communications-preview-2026-10-08'
      - name: Full application gate
        run: |
          set -o pipefail
          bin/gate --online --full 2>&1 | tee gate.log
      - name: Collect verified APK and evidence
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MyNoteBook-Communications-1.1-preview.apk
          cp gate.log docs/releases/communications-preview-2026-10-08.md dist/
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT.txt
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as E, pathlib
          suites=[E.parse(p).getroot() for p in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          assert suites, 'No test results'
          totals={key:sum(int(s.attrib.get(key,0)) for s in suites) for key in ['tests','failures','errors','skipped']}
          assert totals['failures']==0 and totals['errors']==0, totals
          pathlib.Path('dist/TEST_RESULTS.txt').write_text(str(totals)+'\n')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk > dist/APK_SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/*.apk
          (cd dist && sha256sum MyNoteBook-Communications-1.1-preview.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-communications-release
          path: dist/
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-communications-release
          path: dist
      - name: Publish this one preview without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release create communications-preview-2026-10-08 dist/* \
            --target "$SOURCE_SHA" --prerelease \
            --title 'MyNoteBook Communications 1.1 preview' \
            --notes-file dist/communications-preview-2026-10-08.md
