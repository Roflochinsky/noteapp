# Скрипты харнесса ruff-конфига над собой не имели: в корне репозитория его нет,
# а backend/pyproject.toml на scripts/ не распространяется. Здесь повторён набор
# правил бэкенда (AGENTS.md → блок бэкенда), чтобы гейт был тем же самым.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP", "S", "PT", "SIM", "C4", "RUF"]
ignore = [
  # Кириллица в комментариях и сообщениях — язык проекта, а не опечатка.
  "RUF001",
  "RUF002",
  "RUF003",
]

[lint.per-file-ignores]
# Тесты на pytest — это assert по определению; подпроцесс там с фиксированной командой.
"tests/**" = ["S101", "S603", "S607"]
