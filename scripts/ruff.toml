# Ruff-конфиг скриптов харнеса; перенесён из workwatch (там повторял набор правил
# бэкенда). В noteapp другого Python нет, это единственный конфиг.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP", "S", "PT", "SIM", "C4", "RUF"]
ignore = [
  # Кириллица в комментариях и сообщениях — язык проекта, а не опечатка.
  "RUF001",
  "RUF002",
  "RUF003",
]

[lint.per-file-ignores]
# Тесты на pytest — это assert по определению; подпроцесс там с фиксированной командой.
"tests/**" = ["S101", "S603", "S607"]
